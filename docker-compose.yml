services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_agent}
      POSTGRES_DB: knowledge_agent
    # Loopback only: the database is never reachable from other machines.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knowledge_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_agent -d knowledge_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://knowledge_agent:${POSTGRES_PASSWORD:-knowledge_agent}@db:5432/knowledge_agent
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - knowledge_agent_hf_cache:/home/agent/.cache/huggingface

volumes:
  knowledge_agent_pgdata:
  knowledge_agent_hf_cache:
